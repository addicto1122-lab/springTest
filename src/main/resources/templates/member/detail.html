<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 정보 수정</title>
    <!-- static/css/style.css 연결 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:inline="javascript">
    const msg = [[${msg}]];

    if (msg) {
        alert(msg);
    }
</script>

<div class="container">
    <h2 class="page-title">마이페이지</h2>

    <form th:action="@{/member/detail}" method="post" th:object="${user}">
        <input type="hidden" name="id" th:value="*{id}">

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" th:value="*{name}" required>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="text" id="email" name="email" th:value="*{email}" required>
        </div>

        <div class="form-group">
            <label for="pw">비밀번호</label>
            <input type="password" id="pw" name="password" th:value="*{password}" required>
        </div>

        <div class="form-group">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" th:value="*{age}" required>
        </div>

        <div class="btn-group">
            <button type="submit" class="submit-btn">수정하기</button>
            <button type="button" class="delete-btn" onclick="toggleDeletePw()">회원 탈퇴</button>
            <a href="javascript:history.back();" class="cancel-btn">취소</a>
        </div>
    </form>

    <div id="deletePwArea" class="delete-box" style="display: none;">
        <form th:action="@{/member/deleteMember}" method="post" onsubmit="return confirmDelete()">
            <input type="hidden" name="id" th:value="${user.id}">
            <div class="form-group">
                <label for="password">삭제 확인을 위한 비밀번호 입력</label>
                <input type="password" id="password" name="password" placeholder="현재 비밀번호 입력" required>
            </div>

            <div class="btn-group">
                <button type="submit" class="danger-btn">확인 및 탈퇴</button>
                <button type="button" class="cancel-btn" onclick="toggleDeletePw()">취소</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleDeletePw() {
        const deleteArea = document.getElementById('deletePwArea');
        if (deleteArea.style.display === 'none') {
            deleteArea.style.display = 'block';
        } else {
            deleteArea.style.display = 'none';
        }
    }

    function confirmDelete() {
        return confirm("정말로 탈퇴하시겠습니까?");
    }
</script>
</body>
</html>
