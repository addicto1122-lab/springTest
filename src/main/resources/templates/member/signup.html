<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <!-- static/css/style.css 연결 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:inline="javascript">
    const msg = [[${msg}]];

    if (msg) {
        alert(msg);
    }
</script>

<div class="container">
    <h2 class="page-title">회원가입</h2>

    <form th:action="@{/member/signup}" method="post">
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" name="name" id="name" placeholder="이름을 입력하세요." required>
        </div>

        <div class="form-group">
            <label for="age">나이</label>
            <input type="number" name="age" id="age" placeholder="나이를 입력하세요." required>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="text" name="email" id="email" placeholder="이메일을 입력하세요." required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요." required>
        </div>

        <div class="btn-group">
            <button type="submit" class="submit-btn">회원가입</button>
            <a href="/" class="cancel-btn">취소 및 메인으로</a>
        </div>
    </form>
</div>

</body>
</html>
