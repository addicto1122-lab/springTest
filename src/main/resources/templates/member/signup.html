<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<script th:inline="javascript">
    const msg = [[${msg}]];

    if (msg) {
        alert(msg);
    }
</script>
<form th:action="@{/member/signup}" method="post">
    <label for="name">이름: </label>
    <input type="text" name="name" id="name" placeholder="이름을 입력하세요." required="required">
    <br><br>
    <label for="age">나이: </label>
    <input type="number" name="age" id="age" placeholder="나이를 입력하세요." required="required">
    <br><br>
    <label for="email">이메일: </label>
    <input type="text" name="email" id="email" placeholder="이메일을 입력하세요." required="required">
    <br><br>
    <label for="password">비밀번호: </label>
    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요." required="required">
    <br><br>
    <button type="submit">회원가입</button>
</form>
</body>
</html>
