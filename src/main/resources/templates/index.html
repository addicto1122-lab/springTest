<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인페이지</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:inline="javascript">
    const msg = /*[[${msg}]]*/ null;
    if (msg) {
        alert(msg);
    }
    const isLogin = /*[[${session.userName != null}]]*/ false;

    function checkLogin(event) {
        if (!isLogin) {
            event.preventDefault();
            alert("로그인이 필요합니다.");
            location.href = "/member/login";
        }
    }
</script>

<div class="user-nav" th:if="${session.userName != null}">
    <span><strong th:text="${session.userName}"></strong>님 환영합니다.</span>
    <a href="/member/logout">로그아웃</a>
    <a href="/member/detail">마이페이지</a>
</div>
<div class="user-nav" th:if="${session.userName == null}">
    <a href="/member/signup">회원가입</a>
    <a href="/member/login">로그인</a>
</div>
<div class="board-header">
    <h1>게시글 목록</h1>
    <a href="/post/insert" class="btn-write" onclick="checkLogin(event)">글쓰기</a>
</div>
<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>작성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${posts}">
        <td th:text="${p.id}"></td>
        <td>
            <a th:href="@{/post/detail(id=${p.id})}" th:text="${p.title}"></a>
        </td>
        <td th:text="${p.writer}"></td>
        <td th:text="${p.create_at}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(posts)}">
        <td colspan="4" style="text-align: center; color: #9ca3af; padding: 40px 0;">
            등록된 게시글이 없습니다.
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
