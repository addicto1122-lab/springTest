<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:inline="javascript">
    const msg = /*[[${msg}]]*/ null;
    if (msg) {
        alert(msg);
    }
</script>
<div class="container">
    <h1 class="page-title">게시글 작성</h1>
    <form th:action="@{/post/insert}" method="post">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" name="title" id="title" placeholder="제목을 입력하세요." required>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea name="content" id="content" placeholder="내용을 입력하세요." required></textarea>
        </div>
        <div class="btn-group">
            <a th:href="@{/}" class="btn cancel-btn">취소 및 메인으로</a>
            <button type="submit" class="btn submit-btn">등록</button>
        </div>
    </form>
</div>

</body>
</html>
